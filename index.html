<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root{ --bg:#F6F7F9; --tile:#FFFFFF; --edge:#E3E6EA; --ink:#111827; --text:#1F2933; --mute:#6B7280; --chip:#EEF0F3; --chiptx:#4B5563;
         --inflow:#1F9D6A; --outflow:#3B6FD8; --link:#94A3B8; --warn:#B45309; --warnbg:#FFF4E5; --ok:#1F9D6A; --okbg:#E8F6EF; --danger:#B91C1C; --dangerbg:#FDECEC; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; font-size:13px; line-height:1.45; -webkit-text-size-adjust:100%; }
  #app{ max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  .appbar{ padding:14px 16px 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .appbar h1{ margin:0; font-size:19px; font-weight:700; color:var(--ink); }
  .appbar .sub{ font-size:11px; color:var(--mute); }
  .seg2{ display:inline-flex; border:1px solid var(--edge); border-radius:999px; overflow:hidden; height:26px; background:var(--tile); }
  .seg2 button{ font-family:inherit; font-size:11px; padding:0 11px; border:0; background:transparent; color:var(--mute); cursor:pointer; }
  .seg2 button.on{ background:var(--ink); color:#fff; font-weight:700; }
  .seg2[hidden]{ display:none; }
  .body{ flex:1; padding:0 12px 96px; display:flex; flex-direction:column; gap:10px; position:relative; }
  .body.sliding{ overflow-x:clip; min-height:100dvh; } .body.sliding .view{ will-change:transform; }
  .view.slide{ position:absolute; left:12px; right:12px; } .view.anim{ transition:transform .25s ease-out; }
  .view[hidden]{ display:none; } .view{ display:flex; flex-direction:column; gap:10px; }
  .tabs{ position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:520px; display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--edge); background:var(--tile); padding:8px 6px calc(10px + env(safe-area-inset-bottom)); z-index:20; }
  .tabs button{ background:none; border:0; color:var(--mute); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-family:inherit; padding:2px 0; }
  .tabs button svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tabs button.on{ color:var(--outflow); font-weight:700; }
  .fab{ position:fixed; right:calc(50% - 260px + 16px); bottom:calc(74px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; background:var(--ink); color:#fff; border:0; font-size:26px; line-height:1; box-shadow:0 8px 20px rgba(0,0,0,.25); cursor:pointer; z-index:21; font-family:inherit; }
  @media (max-width:520px){ .fab{ right:16px; } }
  .banner{ background:var(--warnbg); color:var(--warn); border-radius:10px; padding:8px 10px; font-size:11.5px; display:flex; align-items:center; gap:8px; }
  .banner button{ margin-left:auto; }
  .review{ background:var(--tile); border:1px solid var(--edge); border-radius:10px; padding:8px 10px; display:flex; align-items:center; gap:8px; cursor:pointer; font-family:inherit; width:100%; text-align:left; color:var(--ink); font-size:12.5px; font-weight:700; }
  .review .cnt{ background:var(--warnbg); color:var(--warn); border-radius:999px; padding:1px 8px; font-size:11px; }
  .review .cnt.ok{ background:var(--okbg); color:var(--ok); }
  .review .arr{ margin-left:auto; color:var(--mute); font-weight:400; }
  .sec{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .sec .num{ background:var(--ink); color:#fff; font-size:10px; font-weight:700; border-radius:999px; padding:1px 7px; letter-spacing:.06em; }
  .sec h3{ margin:0; font-size:13px; font-weight:700; color:var(--ink); } .sec::after{ content:""; flex:1; height:1px; background:var(--edge); }
  /* ---- ツリー表示（系統ごとに白カード、行はタイル枠なし） ---- */
  .tree{ background:var(--tile); border:1px solid var(--edge); border-radius:12px; padding:4px 12px; }
  .row{ position:relative; display:flex; align-items:center; gap:9px; height:52px; padding-left:calc(var(--d,0) * 28px); cursor:pointer; text-align:left; width:100%; font-family:inherit; color:var(--text); background:none; border:0; border-radius:8px; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  .row + .row::after{ content:""; position:absolute; left:calc(var(--d,0) * 28px + 36px); right:0; top:0; height:1px; background:#EEF1F5; }
  .row .av{ position:relative; z-index:1; }
  .row .t .n{ font-size:14px; } .row .t .s{ font-size:11px; }

  // ===== 自動レイアウト（ツリー行） =====
  function layout(){
    const hubs = S.nodes.filter(n=>n.hub && n.type==="bank");
    const hubList = hubs.length ? hubs : S.nodes.filter(n=>n.type==="bank").slice(0,1);
    const fe = flowEdges(); const dist = {};
    hubList.forEach(h=>{ dist[h.id]={}; const q=[[h.id,0]]; const seen=new Set([h.id]); while(q.length){ const [x,d]=q.shift(); dist[h.id][x]=d; fe.forEach(e=>{ const y = e.from===x?e.to: e.to===x?e.from:null; if(y && !seen.has(y)){ seen.add(y); q.push([y,d+1]); } }); } });
    const owner = {}; S.nodes.forEach(n=>{ if(n.hub && n.type==="bank"){ owner[n.id]=n.id; return; } let best=null, bd=1e9; hubList.forEach(h=>{ const d=dist[h.id][n.id]; if(d!=null && d<bd){ bd=d; best=h.id; } }); owner[n.id]=best; });
    const placedAll = new Set();
    const sections = hubList.map((h,hi)=>{
      const rows=[]; const placed=new Set([h.id]);
      const incomes = inTo(h.id).filter(e=>e.kind==="in" && byId(e.from) && byId(e.from).type==="income");
      incomes.forEach(e=>{ rows.push({id:e.from, eid:e.id, depth:0, kind:"in", inc:true, guides:[], offb:false}); placed.add(e.from); });
      rows.push({id:h.id, depth:0, kind:"hub", hub:true, hasin:incomes.length>0, guides:[], offb:false});
      // 子の一覧: 出金・入金 → 連携 の順。配置済みの相手は「分身行」(ghost)、別系統のハブは jump 行
      const parentOf = {};
      const children = x => {
        const seenC = new Set(); const out = [];
        const push = (id, kind, eid) => { const n = byId(id); if(!n || seenC.has(id) || id===parentOf[x]) return; seenC.add(id);
          const isHub = n.hub && n.id!==h.id; const ghost = !isHub && (placed.has(id) || (owner[id]!==h.id && owner[id]!=null));
          out.push({id, kind, eid, ghost, jump: isHub ? hubList.indexOf(n) : -1}); };
        outOf(x).filter(e=>e.kind!=="link").forEach(e=>push(e.to, e.kind, e.id));
        S.edges.filter(e=>e.kind==="link" && (e.from===x||e.to===x)).forEach(e=>push(e.from===x?e.to:e.from, "link", e.id));
        return out;
      };
      const walk=(x, depth, guides, offb, anc)=>{
        const cs = children(x);
        cs.forEach(c=>{ if(!c.ghost && c.jump<0){ placed.add(c.id); parentOf[c.id]=x; } });
        if(cs.length){ const pr = rows.find(r=>r.id===x && !r.ghost); if(pr){ pr.par=true; pr.pk=cs[0].kind; } }
        cs.forEach((c,i)=>{ const n=byId(c.id); const last = i===cs.length-1; const real = !c.ghost && c.jump<0;
          rows.push({id:c.id, eid:c.eid, depth:Math.min(depth,4), kind:c.kind, child:true, last, guides:guides.slice(), offb, jump:c.jump, ghost:c.ghost, anc:anc, back: S.edges.some(e=>e.kind!=="link" && e.from===c.id && e.to===x)});
          if(real && depth<4) walk(c.id, depth+1, [...guides, {on:!last, kind:c.kind}], offb || !!n.off, [...anc, c.id]);
        });
      };
      walk(h.id, 1, [], !!h.off, [h.id]);
      placed.forEach(id=>placedAll.add(id));
      return {hub:h, rows};
    });
    return {sections, unplaced: S.nodes.filter(n=>!placedAll.has(n.id))};
  }

  // ===== 見直し候補 =====
  function review(){
    const unlinked = S.nodes.filter(n=>n.type==="bank" && degree(n.id)===0);
    const groups = {}; S.nodes.filter(n=>!n.off && (n.type==="pay"||n.type==="card")).forEach(n=>{ const p = inTo(n.id).find(e=>e.kind==="out"); if(p){ const k=n.type+"@"+p.from; (groups[k]=groups[k]||[]).push(n); } });
    const dups = Object.values(groups).filter(g=>g.length>1);
    const byDay = {}; S.debits.filter(d=>!viaOff(d)).forEach(d=>{ byDay[d.day]=(byDay[d.day]||0)+1; });
    const busy = Object.entries(byDay).filter(([d,c])=>c>=2).map(([d])=>dayLabel(+d));
    return {unlinked, dups, busy, count: unlinked.length + dups.length + (busy.length?1:0)};
  }
  let reviewOpen = false;
  function reviewHtml(){
    const r = review();

  }

  // ===== マップ =====
  let newEid = null, seenIds = new Set(), curRows = [];
  function rowHtml(r){

  // ===== 引き落とし =====

  function renderDebit(){
    const live = S.debits.filter(d=>!viaOff(d));
    const spend = live.filter(d=>!d.transfer);
    const fixed = spend.filter(d=>d.amt!=null).reduce((a,d)=>a+Number(d.amt),0), varn = spend.filter(d=>d.amt==null).length, apxn = spend.filter(d=>d.amt!=null && d.approx).length;
    const now = new Date(), today = now.getDate(), dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate(); const realDay = d => d.day>=31 ? dim : Math.min(d.day, dim);
    const rest = spend.filter(d=>realDay(d)>=today); const restFixed = rest.filter(d=>d.amt!=null).reduce((a,d)=>a+Number(d.amt),0), restVar = rest.filter(d=>d.amt==null).length, restApx = rest.some(d=>d.amt!=null && d.approx);
    const xfer = live.filter(d=>d.transfer && d.amt!=null).reduce((a,d)=>a+Number(d.amt),0), xfern = live.filter(d=>d.transfer).length;
    const byDay = {}; live.forEach(d=>{ (byDay[d.day]=byDay[d.day]||[]).push(d); });
    const dayFixed = d => (byDay[d]||[]).filter(x=>x.amt!=null).reduce((a,x)=>a+Number(x.amt),0);
    const max = Math.max(0, ...Object.keys(byDay).map(d=>dayFixed(+d)));
    const H = live.some(d=>d.amt==null) ? 52 : 64;
    const cols = Array.from({length:31},(_,i)=>i+1).map(day=>{ const segs=[...(byDay[day]||[])].sort((a,b)=>(a.amt==null)-(b.amt==null)).map(x=>{ const bk=byId(x.source); const col=bk?bk.col:"#94A3B8";

      return `<div class="col ${day<today?"past":""}">${segs}</div>`; }).join("");

    const ref = refv ? `<div class="ref" style="bottom:${Math.round(refv/max*H)}px"><b>${refv/1e4}万</b></div>` : "";
    let labs=""; for(let d=1; d<=31; ){ const on=!!byDay[d]; if(on){ let e=d; while(e<31 && byDay[e+1]) e++; const n=e-d+1; const txt = n===1 ? (d===31?"末":d) : `${d}${n===2?"·":"–"}${e===31?"末":e}`; labs += `<i class="on" style="grid-column:span ${n}">${txt}</i>`; d=e+1; } else { labs += `<i>${d===1||d===10||d===20?d:(d===31?"末":"")}</i>`; d++; } }
    const kinds = { f: live.some(d=>d.amt!=null && !d.approx && !d.transfer), a: live.some(d=>d.amt!=null && d.approx && !d.transfer), x: live.some(d=>d.transfer), u: live.some(d=>d.amt==null) };

    const lg = lgKeys.length>=2 ? `<div class="lg">${lgKeys.map(k=>`<span><i class="${k}"></i>${lgTxt[k]}</span>`).join("")}</div>` : "";

    const chart = `<div class="chart"><div class="bars">${ref}${cols}${tdy}</div><div class="lab">${labs}</div>${lg}</div>`;
    const banks = S.nodes.filter(n=>n.type==="bank" && S.debits.some(d=>d.source===n.id));
    const need = banks.map(b=>{ const l=live.filter(d=>d.source===b.id); if(!l.length) return ""; const f=l.filter(d=>d.amt!=null).reduce((a,d)=>a+Number(d.amt),0); const v=l.filter(d=>d.amt==null).length; const ap=l.filter(d=>d.amt!=null && d.approx).length; const last=Math.max(...l.map(d=>d.day)); const inc = live.filter(d=>d.transfer && d.via===b.id && d.amt!=null).map(d=>`<span class="s in">${dayLabel(d.day)}に${esc(byId(d.source)?.name||"")}から ${yen(d.amt)} 入金</span>`).join(""); return `<div class="need">${avatar(b)}<div class="t"><span class="n">${esc(b.name)}</span><span class="s">${dayLabel(last)}までに必要</span>${inc}</div><div class="amt">${ap?"約":""}${yen(f)}${ap?`<small>目安 ${ap}件を含む</small>`:""}${v?`<small>＋ 未設定 ${v}件</small>`:""}</div></div>`; }).join("");
    const sums = {}; spend.filter(d=>d.amt!=null).forEach(d=>{ const c=catOf(d); sums[c]=(sums[c]||0)+Number(d.amt); }); const total = Object.values(sums).reduce((a,v)=>a+v,0);

      + `<div class="today">今日（${today}日）以降の支出 <b>${rest.length}件 ・ ${restApx?"約":""}${yen(restFixed)}</b>${restVar?` ＋ 未設定 ${restVar}件`:""}</div>${chart}` + need +

    if(!isNew) document.getElementById("delD").addEventListener("click", ()=>{ if(!confirm("この引き落としを削除します。")) return; S.debits=S.debits.filter(x=>x.id!==d.id); save(); closeSheet(); renderAll(); });

  // ===== 長押しドラッグ: 行の上で離す＝つなぐ ／ 行の間で離す＝移動 =====
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.id="dragline";
  svg.innerHTML = '<line x1="0" y1="0" x2="0" y2="0" stroke="#3B6FD8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><circle r="7" fill="#3B6FD8"/>';
  document.body.appendChild(svg);
  const hint = document.createElement("div"); hint.className="draghint"; hint.textContent="相手の上で離すとつなぐ ・ 行の間で離すと移動"; document.body.appendChild(hint);
  const dropline = document.createElement("div"); dropline.id="dropline"; document.body.appendChild(dropline);
  const line = svg.querySelector("line"), dotEl = svg.querySelector("circle");
  let timer=null, src=null, srcEl=null, start=null, dragging=false, target=null, suppressClick=false, drop=null, lastPt=null, asDir=0;
  const tileAt = (x,y) => { const el = document.elementFromPoint(x,y); return el ? el.closest("[data-edit]") : null; };
  const clearTarget = () => { if(target){ target.classList.remove("target"); target=null; } };
  const clearDrop = () => { drop=null; dropline.classList.remove("on"); };
  const endDrag = () => { dragging=false; asDir=0; clearTimeout(timer); timer=null; document.body.classList.remove("dragging"); svg.classList.remove("on"); hint.classList.remove("on"); if(srcEl) srcEl.classList.remove("lift"); clearTarget(); clearDrop(); };
  const descendants = id => { const s=new Set(); const q=[id]; while(q.length){ const x=q.shift(); outOf(x).filter(e=>e.kind!=="link").forEach(e=>{ if(!s.has(e.to)){ s.add(e.to); q.push(e.to); } }); } return s; };
  const srcMovable = el => el && el.classList.contains("row") && (el.dataset.rk==="out" || el.dataset.rk==="in");
  // 隙間の上の行 A から「移動先の親」と「A の直後」を決める
  const gapPlan = (A, B) => {
    if(!A || A.dataset.rk==="inc") return null;
    const aPar = A.dataset.par || null; let parent, afterEid;
    if(A.dataset.rk==="hub" || (B && B.dataset.par===A.dataset.edit)){ parent = A.dataset.edit; afterEid = null; }
    else { if(!aPar) return null; parent = aPar; afterEid = A.dataset.eid || null; }
    const pr = document.querySelector(`.row[data-edit="${parent}"]:not(.ghost)`); if(parent===src || (pr && (pr.dataset.anc||"").split(",").includes(src))) return null;
    return {parent, afterEid};
  };
  const showDrop = (y, plan, tree) => {
    const pr = document.querySelector(`.row[data-edit="${plan.parent}"]:not(.ghost)`); const pd = pr ? +pr.dataset.depth : 0;
    const tr = tree.getBoundingClientRect(); const left = tr.left + 12 + (Math.min(pd,3)+1)*28 - 15;
    dropline.style.left = left+"px"; dropline.style.width = Math.max(40, tr.right-12-left)+"px"; dropline.style.top = (y-2)+"px"; dropline.classList.add("on");
  };
  const updateDrop = (x,y) => {
    const t = tileAt(x,y); const tree = t ? t.closest(".tree") : null;
    if(t && tree && t.classList.contains("row")){
      const r = t.getBoundingClientRect(); const rel = (y-r.top)/r.height;
      const sameGap = drop && drop.row===t; const lo = sameGap && drop.side==="before" ? 0.34 : 0.30, hi = sameGap && drop.side==="after" ? 0.66 : 0.70;
      let side = rel<lo ? "before" : rel>hi ? "after" : null;
      if(side){
        const A = side==="before" ? (t.previousElementSibling && t.previousElementSibling.classList.contains("row") ? t.previousElementSibling : null) : t;
        const B = side==="before" ? t : (t.nextElementSibling && t.nextElementSibling.classList.contains("row") ? t.nextElementSibling : null);
        const plan = (t.dataset.edit!==src && !(A && A.dataset.edit===src) && !(B && B.dataset.edit===src)) ? gapPlan(A,B) : null;
        clearTarget(); drop={row:t, side, plan}; if(plan) showDrop(side==="before"? r.top : r.bottom, plan, tree); else dropline.classList.remove("on"); return;
      }
    }
    clearDrop();
    if(t !== target){ clearTarget(); if(t && t.dataset.edit !== src){ target=t; t.classList.add("target"); } }
  };
  const autoScroll = () => { if(!dragging) return; if(asDir){ window.scrollBy(0, asDir*6); if(lastPt) updateDrop(lastPt.x, lastPt.y); } requestAnimationFrame(autoScroll); };
  document.addEventListener("pointerdown", e=>{
    const el = e.target.closest("[data-edit]"); if(!el || e.button>0 || sheet.classList.contains("on")) return;
    src = el.dataset.edit; srcEl = el; start = {x:e.clientX, y:e.clientY}; dragging=false; clearTimeout(timer);
    timer = setTimeout(()=>{ dragging=true; suppressClick=true; lastPt={x:start.x,y:start.y};
      if(UI.mode!=="full"){ setMode("full"); srcEl = document.querySelector(`.row[data-edit="${src}"]:not(.ghost)`) || srcEl; }
      document.body.classList.add("dragging"); srcEl.classList.add("lift"); svg.classList.add("on"); hint.classList.add("on");
      const r = srcEl.getBoundingClientRect(); line.setAttribute("x1", r.left+r.width/2); line.setAttribute("y1", r.top+r.height/2); line.setAttribute("x2", start.x); line.setAttribute("y2", start.y); dotEl.setAttribute("cx", start.x); dotEl.setAttribute("cy", start.y);
      if(navigator.vibrate) navigator.vibrate(15); requestAnimationFrame(autoScroll); }, 400);
  }, {passive:true});
  document.addEventListener("pointermove", e=>{
    if(!srcEl) return;
    if(!dragging){ if(start && Math.hypot(e.clientX-start.x, e.clientY-start.y) > 8){ clearTimeout(timer); timer=null; srcEl=null; } return; }
    lastPt={x:e.clientX, y:e.clientY};
    line.setAttribute("x2", e.clientX); line.setAttribute("y2", e.clientY); dotEl.setAttribute("cx", e.clientX); dotEl.setAttribute("cy", e.clientY);
    const bottomEdge = window.innerHeight - 74 - 60; asDir = e.clientY < 80 ? -1 : (e.clientY > bottomEdge ? 1 : 0);
    if(srcMovable(srcEl)) updateDrop(e.clientX, e.clientY);
    else { const t = tileAt(e.clientX, e.clientY); if(t !== target){ clearTarget(); if(t && t.dataset.edit !== src){ target=t; t.classList.add("target"); } } }
  }, {passive:true});
  document.addEventListener("touchmove", e=>{ if(dragging) e.preventDefault(); }, {passive:false});
  document.addEventListener("contextmenu", e=>{ if(e.target.closest("[data-edit]")) e.preventDefault(); });
  const finish = e => {
    if(!srcEl) return;
    if(!dragging){ clearTimeout(timer); timer=null; srcEl=null; return; }
    const to = target ? target.dataset.edit : null; const from = src; const hadDrop = !!drop; const plan = drop ? drop.plan : null; const eid = srcEl.dataset.eid; endDrag(); srcEl=null;
    if(hadDrop){ if(plan && eid) moveEdge(eid, plan.parent, plan.afterEid); }

  };
  document.addEventListener("pointerup", finish); document.addEventListener("pointercancel", finish);
  document.addEventListener("click", e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); } }, true);
  function moveEdge(eid, parent, afterEid){
    const i = S.edges.findIndex(e=>e.id===eid); if(i<0) return; const e = S.edges[i]; const undo = {from:e.from, index:i};
    S.edges.splice(i,1); e.from = parent;
    let at; if(afterEid){ const j = S.edges.findIndex(x=>x.id===afterEid); at = j<0 ? S.edges.length : j+1; }
    else { const j = S.edges.findIndex(x=>x.from===parent && x.kind!=="link"); at = j<0 ? S.edges.length : j; }
    if(at===undo.index && e.from===undo.from){ S.edges.splice(at,0,e); return; }
    S.edges.splice(at,0,e); S.settings.sample=false; save(); newEid=eid; renderAll();
    const p = byId(parent), n = byId(e.to);
    toastAction(`${n?n.name:""} を ${p?p.name:""} の下へ移動しました`, "元に戻す", ()=>{ const k=S.edges.findIndex(x=>x.id===eid); if(k<0) return; S.edges.splice(k,1); e.from=undo.from; S.edges.splice(Math.min(undo.index,S.edges.length),0,e); save(); renderAll(); });
  }
  function connect(from, to){
    const a=byId(from), b=byId(to); if(!a||!b) return;
    const kind = AUTO_KIND(a,b); const e = {id:uid("e"), from:a.id, to:b.id, kind, label:""};
    S.edges.push(e); S.settings.sample=false; save(); newEid=e.id; renderAll();
    toastAction(`${a.name} → ${b.name}（${KINDS[kind]}）`, "変更", ()=>edgeForm(e.id));
  }

  // ===== 引き落としの左スワイプ削除 =====
  function deleteDebit(id){ const i=S.debits.findIndex(x=>x.id===id); if(i<0) return; const d=S.debits[i]; S.debits.splice(i,1); save(); renderAll(); toastAction("削除しました", "元に戻す", ()=>{ S.debits.splice(Math.min(i,S.debits.length),0,d); save(); renderAll(); }); }
  let swEl=null, swStart=null, swMode=null, swOpen=null, swBase=0;
  const swSet = (el,x) => { el.style.transform = x ? `translateX(${x}px)` : ""; };
  const swClose = () => { if(swOpen){ swOpen.classList.remove("sw"); swSet(swOpen,0); swOpen=null; } };
  document.addEventListener("pointerdown", e=>{ const el=e.target.closest(".dwrap .drow"); if(!el || e.button>0 || sheet.classList.contains("on")){ if(!e.target.closest(".dwrap")) swClose(); return; } if(swOpen && swOpen!==el) swClose(); swEl=el; swStart={x:e.clientX,y:e.clientY}; swMode="pending"; swBase = (swOpen===el) ? -72 : 0; }, {passive:true});
  document.addEventListener("pointermove", e=>{ if(!swEl || swMode==="off") return; const dx=e.clientX-swStart.x, dy=e.clientY-swStart.y;
    if(swMode==="pending"){ if(Math.abs(dy)>10 && Math.abs(dy)>Math.abs(dx)){ swMode="off"; return; } if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){ swMode="swipe"; suppressClick=true; swEl.classList.add("sw"); try{ swEl.setPointerCapture(e.pointerId); }catch(x){} } else return; }
    swSet(swEl, Math.max(-72, Math.min(0, swBase+dx))); }, {passive:true});
  const swEnd = e => { if(!swEl) return; const el=swEl; const mode=swMode; swEl=null; swMode=null; if(mode!=="swipe") return; const dx=e.clientX-swStart.x; const x=swBase+dx; el.classList.remove("sw");
    if(x<=-36){ swSet(el,-72); swOpen=el; } else { swSet(el,0); if(swOpen===el) swOpen=null; }
    setTimeout(()=>{ suppressClick=false; }, 50); };
  document.addEventListener("pointerup", swEnd); document.addEventListener("pointercancel", swEnd);
  window.addEventListener("scroll", ()=>{ if(swOpen && !swEl) swClose(); }, {passive:true});
  document.body.addEventListener("click", e=>{ const d=e.target.closest("[data-del]"); if(d){ e.stopPropagation(); swOpen=null; deleteDebit(d.dataset.del); } }, true);

  // ===== 共通 =====
  let view="map";
  const META = { map:["マップ", ()=>`${S.nodes.length}機関`], debit:["引き落とし", ()=>"毎月の予定"], share:["共有", ()=>"もしもの時のために"] };
  function show(v){ view=v; ["map","debit","share"].forEach(k=>{ document.getElementById("v-"+k).hidden=(k!==v); }); document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); document.getElementById("ttl").textContent=META[v][0]; document.getElementById("sub").textContent=META[v][1](); document.getElementById("sub").hidden=(v==="map"); document.getElementById("seg2").hidden=(v!=="map"); document.getElementById("fab").hidden = (v==="share"); window.scrollTo(0,0); }
  // ===== 横スワイプで画面切替（指に追従して横スライド） =====
  const VIEWS = ["map","debit","share"]; let tsw=null; const bodyEl = document.querySelector(".body");
  const slideFinish = (t, complete) => {
    const w = bodyEl.clientWidth; const cur=t.cur, nxt=t.nxt;
    cur.classList.add("anim"); if(nxt) nxt.classList.add("anim");
    if(nxt && complete){ cur.style.transform=`translateX(${t.dir*w}px)`; nxt.style.transform="translateX(0)"; }
    else { cur.style.transform="translateX(0)"; if(nxt) nxt.style.transform=`translateX(${-t.dir*w}px)`; }
    setTimeout(()=>{ [cur,nxt].forEach(v=>{ if(!v) return; v.classList.remove("anim","slide"); v.style.transform=""; v.style.top=""; }); bodyEl.classList.remove("sliding");
      if(nxt && complete){ show(nxt.id.slice(2)); } else if(nxt){ nxt.hidden=true; } }, 270);
  };
  document.addEventListener("pointerdown", e=>{ if(e.button>0 || sheet.classList.contains("on") || e.target.closest(".dwrap, input, textarea, select, .sheet, .tabs")){ tsw=null; return; } tsw={x:e.clientX, y:e.clientY, t0:performance.now(), done:false, active:false}; }, {passive:true});
  document.addEventListener("pointermove", e=>{ if(!tsw || tsw.done || dragging) return; const dx=e.clientX-tsw.x, dy=e.clientY-tsw.y;
    if(!tsw.active){
      if(Math.abs(dy)>30 && Math.abs(dy)>Math.abs(dx)){ tsw.done=true; return; }
      if(!(Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.5)) return;
      const dir = dx<0 ? -1 : 1; const i=VIEWS.indexOf(view); const j=i-dir; const w=bodyEl.clientWidth;
      tsw.active=true; tsw.dir=dir; tsw.cur=document.getElementById("v-"+view); tsw.nxt=(j>=0 && j<VIEWS.length) ? document.getElementById("v-"+VIEWS[j]) : null;
      swClose(); bodyEl.classList.add("sliding"); suppressClick=true;
      if(tsw.nxt){ const br=bodyEl.getBoundingClientRect(); tsw.nxt.style.top=Math.max(0,-br.top)+"px"; tsw.nxt.classList.add("slide"); tsw.nxt.style.transform=`translateX(${-dir*w}px)`; tsw.nxt.hidden=false; }
    }
    const w=bodyEl.clientWidth; const x = tsw.nxt ? dx : dx*0.25;
    tsw.cur.style.transform=`translateX(${x}px)`; if(tsw.nxt) tsw.nxt.style.transform=`translateX(${x - tsw.dir*w}px)`; tsw.dx=dx;
  }, {passive:true});
  document.addEventListener("touchmove", e=>{ if(tsw && tsw.active) e.preventDefault(); }, {passive:false});
  const tswEnd = () => { if(!tsw) return; const t=tsw; tsw=null; if(!t.active) return;
    const w=bodyEl.clientWidth; const dx=t.dx||0; const fast = performance.now()-t.t0 < 300 && Math.abs(dx)>30;
    const complete = !!t.nxt && Math.sign(dx)===t.dir && (Math.abs(dx) > w*0.3 || fast);
    slideFinish(t, complete); setTimeout(()=>{ suppressClick=false; }, 300); };
  document.addEventListener("pointerup", tswEnd); document.addEventListener("pointercancel", tswEnd);
  let tt, ta; function toast(msg){ const el=document.getElementById("toast"); el.classList.remove("act"); el.textContent=msg; el.classList.add("show"); clearTimeout(tt); clearTimeout(ta); tt=setTimeout(()=>el.classList.remove("show"),1800); }
  function toastAction(msg, label, fn){ const el=document.getElementById("toast"); el.classList.add("act"); el.innerHTML=`<span>${esc(msg)}</span><button>${esc(label)}</button>`; el.querySelector("button").addEventListener("click", ()=>{ el.classList.remove("show","act"); fn(); }); el.classList.add("show"); clearTimeout(tt); clearTimeout(ta); ta=setTimeout(()=>{ el.classList.remove("show","act"); }, 5000); }
  function renderBanner(){ document.getElementById("banner").innerHTML = S.settings.sample ? `<div class="banner">架空のサンプルです。編集すると自分のデータになります。<button class="btn sm" id="startEmpty">空にする</button></div>` : ""; const b=document.getElementById("startEmpty"); if(b) b.addEventListener("click", ()=>{ if(!confirm("サンプルを消して空から始めます。")) return; S={version:1,nodes:[],edges:[],debits:[],settings:{sample:false}}; save(); renderAll(); }); }
  function renderAll(){ renderBanner(); renderMap(); renderDebit(); renderShare(); document.getElementById("prhead").innerHTML = `お金の流れマップ<small>${esc(S.settings.updated||"")} 時点</small>`; document.getElementById("sub").textContent=META[view][1](); }
  document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.v); });
  document.getElementById("fab").addEventListener("click", ()=>{ if(view==="debit") debitForm({id:uid("d"),day:27,amt:null,rollover:true}, true); else nodeForm({id:uid("n"),name:"",sub:"",type:"bank",av:"?",col:TYPE_STYLE.bank[0],sq:false,hub:false,ap:false,off:false}, true); });
  function flashTo(o){ if(!o) return; o.scrollIntoView({block:"center", behavior:"smooth"}); o.classList.remove("new"); void o.offsetWidth; o.classList.add("new"); }
  function jumpTo(id){ const q=()=>document.querySelector(`.row[data-edit="${id}"]:not(.ghost), .mini[data-edit="${id}"]`); let o=q(); if(!o && UI.mode!=="full"){ setMode("full"); o=q(); } flashTo(o); }
  document.getElementById("seg2").addEventListener("click", e=>{ const x=e.target.closest("button"); if(x) setMode(x.dataset.m); });
  document.body.addEventListener("click", e=>{ const g=e.target.closest("[data-goto]"); if(g){ e.stopPropagation(); jumpTo(g.dataset.goto); return; } const m=e.target.closest("[data-more]"); if(m){ e.stopPropagation(); const id=m.dataset.more; setMode("full"); flashTo(document.querySelector(`.row[data-edit="${id}"]:not(.ghost)`)); return; } const c=e.target.closest(".chart .bars"); if(c){ const r=c.getBoundingClientRect(); const day=Math.min(31, Math.max(1, Math.floor((e.clientX-r.left)/r.width*31)+1)); const cand=[...document.querySelectorAll(".drow[data-day]")].map(x=>[Math.abs(+x.dataset.day-day), x]).sort((a,b)=>a[0]-b[0])[0]; if(cand && cand[0]<=2) flashTo(cand[1]); return; } const t=e.target.closest("[data-edit]"); if(t){ const n=byId(t.dataset.edit); if(n) nodeForm(n,false); return; } const d=e.target.closest("[data-editd]"); if(d){ const x=S.debits.find(y=>y.id===d.dataset.editd); if(x) debitForm(x,false); } });
  load(); setMode(UI.mode, false); renderAll(); show("map");
})();
</script>
</body>
