<style>
  :root{ --bg:#F6F7F9; --tile:#FFFFFF; --edge:#E3E6EA; --ink:#111827; --text:#1F2933; --mute:#6B7280; --chip:#EEF0F3; --chiptx:#4B5563;
         --zone:#ECEFF4; --inflow:#1F9D6A; --outflow:#3B6FD8; --link:#94A3B8; --warn:#B45309; --warnbg:#FFF4E5; --ok:#1F9D6A; --okbg:#E8F6EF;
         --danger:#B91C1C; --dangerbg:#FDECEC; --sheet:#FFFFFF; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; font-size:13px; line-height:1.45; -webkit-text-size-adjust:100%; }
  #app{ max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; background:var(--bg); padding-top:env(safe-area-inset-top); }
  .appbar{ padding:14px 16px 8px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .appbar h1{ margin:0; font-size:19px; font-weight:700; color:var(--ink); }
  .appbar .sub{ font-size:11px; color:var(--mute); }
  .body{ flex:1; padding:0 12px 96px; display:flex; flex-direction:column; gap:10px; }
  .view[hidden]{ display:none; }
  .view{ display:flex; flex-direction:column; gap:10px; }
  .tabs{ position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:520px; display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--edge); background:var(--tile); padding:8px 6px calc(10px + env(safe-area-inset-bottom)); z-index:20; }
  .tabs button{ background:none; border:0; color:var(--mute); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-family:inherit; padding:2px 0; }
  .tabs button svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tabs button.on{ color:var(--outflow); font-weight:700; }
  .fab{ position:fixed; right:calc(50% - 260px + 16px); bottom:calc(74px + env(safe-area-inset-bottom)); width:52px; height:52px; border-radius:50%; background:var(--ink); color:#fff; border:0; font-size:26px; line-height:1; box-shadow:0 8px 20px rgba(0,0,0,.25); cursor:pointer; z-index:21; font-family:inherit; }
  @media (max-width:520px){ .fab{ right:16px; } }
  .banner{ background:var(--warnbg); color:var(--warn); border-radius:10px; padding:8px 10px; font-size:11.5px; display:flex; align-items:center; gap:8px; }
  .banner button{ margin-left:auto; }

  .sec{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .sec .num{ background:var(--ink); color:#fff; font-size:10px; font-weight:700; border-radius:999px; padding:1px 7px; letter-spacing:.06em; }
  .sec h3{ margin:0; font-size:13px; font-weight:700; color:var(--ink); }
  .sec::after{ content:""; flex:1; height:1px; background:var(--edge); }
  .tile{ background:var(--tile); border:1px solid var(--edge); border-radius:10px; padding:9px 10px; display:flex; align-items:center; gap:9px; cursor:pointer; text-align:left; width:100%; font-family:inherit; color:var(--text); }
  .tile:active{ background:#F1F3F7; }
  .tile.hub{ border-color:var(--ink); border-width:1.5px; }
  .tile.dim{ border-style:dashed; border-color:#C9CFD8; }
  .tile.off{ opacity:.45; } .tile.off .n{ text-decoration:line-through; }
  .tile.zone{ background:var(--zone); }
  .av{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px; flex:none; }
  .av.sq{ border-radius:7px; }
  .t{ display:flex; flex-direction:column; min-width:0; flex:1; }
  .t .n{ font-weight:700; color:var(--ink); font-size:13px; line-height:1.3; }
  .t .s{ color:var(--mute); font-size:10.5px; }
  .chips{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:44%; }
  .chip{ background:var(--chip); color:var(--chiptx); font-size:9.5px; border-radius:999px; padding:2px 7px; white-space:nowrap; }
  .chip.ap{ background:#111111; color:#fff; font-weight:700; }
  .chip.ok{ background:var(--okbg); color:var(--ok); }
  .chip.off{ background:var(--dangerbg); color:var(--danger); }
  .flow{ display:grid; grid-template-columns:22px 1fr; column-gap:6px; row-gap:6px; }
  .flow .c{ position:relative; }
  .flow .c::before{ content:""; position:absolute; left:10px; top:-6px; bottom:-6px; width:2px; background:var(--lc,var(--outflow)); }
  .flow .c::after{ content:""; position:absolute; left:4px; top:50%; width:10px; height:2px; background:var(--lc,var(--outflow)); transform:translateY(-1px); }
  .flow .c.end::before{ bottom:50%; } .flow .c.start::before{ top:50%; } .flow .c.only::before{ display:none; }

<script>
(function(){
  "use strict";
  const KEY = "moneymap.v1";
  const TYPES = { income:"収入", bank:"銀行口座", card:"カード", securities:"証券・取引所", wallet:"ウォレット", pay:"QR・電子マネー", app:"アプリ・サービス", use:"利用先" };
  const TYPE_DEFAULT = { income:["収","#1F9D6A",false], bank:["銀","#1F4E79",false], card:["C","#374151",true], securities:["証","#0B5AA5",false], wallet:["W","#F6851B",true], pay:["P","#BF0000",true], app:["A","#8B5CF6",true], use:["店","#4B5563",true] };
  const KINDS = { in:"入金（緑）", out:"出金・チャージ（青）", link:"連携（線なし・チップ）" };

  // ===== サンプルデータ（架空） =====
  function sample(){
    const N = [
      ["salary","給与","給与振込","income","収","#1F9D6A",false,{}],
      ["mainbank","メイン銀行","給与振込口座","bank","M","#1F4E79",false,{hub:true}],
      ["bankb","銀行B","","bank","B","#BF0000",false,{}],
      ["bankc","銀行C","","bank","C","#00A040",false,{}],
      ["carda","クレジットカードA","26日引き落とし","card","CA","#1F4E79",true,{ap:true,chips:["ETC"]}],
      ["cardb","クレジットカードB","27日引き落とし","card","CB","#BF0000",true,{ap:true}],
      ["ideco","iDeCo運営管理機関","iDeCo ・ 毎月積立","securities","i","#0B5AA5",false,{}],
      ["seca","証券会社A","","securities","A","#BF0000",false,{}],
      ["exa","暗号資産取引所A","暗号資産取引所","securities","X","#005BAC",false,{}],
      ["exb","暗号資産取引所B","暗号資産取引所","securities","Y","#0B5AA5",false,{}],
      ["subbank","サブ銀行","自動入金 毎月5日","bank","S","#CC0033",false,{hub:true}],
      ["family","家族の口座","生活費 ・ 月末自動振込","bank","家","#1F4E79",true,{}],
      ["secb","証券会社B","ハイブリッド預金","securities","B","#0B5AA5",false,{}],
      ["debit","デビットカード","クリプトカード非対応店で利用","card","D","#CC0033",true,{ap:true}],
      ["stable","ステーブルコイン購入","円建てステーブルコイン","wallet","¥","#1C4FA0",true,{zone:true}],
      ["paya","QR決済A","","pay","Qa","#BF0000",true,{}],
      ["payb","QR決済B","","pay","Qb","#FF0033",true,{}],
      ["vend","自販機アプリ","","use","自","#0A84C1",true,{}],
      ["drink","飲料アプリ","","use","飲","#E60012",true,{}],
      ["walleta","ウォレットA","ウォレット","wallet","Wa","#F6851B",true,{zone:true}],
      ["crypto","クリプトカード","","card","K","#111111",true,{ap:true,zone:true}],
      ["walletb","ウォレットB","ウォレット","wallet","Wb","#AB9FF2",true,{zone:true}],
      ["appa","アプリA","","app","a","#3DDC84",true,{zone:true}],
      ["appb","アプリB","","app","b","#9B6BFF",true,{zone:true}],
      ["ic","交通IC","チャージ","use","IC","#6BBF3B",true,{ap:true}],
      ["shop","通販サイト","支払い","use","通","#FF9900",true,{}],
      ["food","飲食店","支払い","use","食","#4B5563",true,{}],
      ["conv","コンビニ","支払い","use","コ","#4B5563",true,{}],
    ].map(([id,name,sub,type,av,col,sq,x])=>Object.assign({id,name,sub,type,av,col,sq,hub:false,ap:false,zone:false,chips:[],off:false},x));
    const E = [
      ["salary","mainbank","in","給与振込"],["mainbank","carda","out","引き落とし"],["mainbank","cardb","out","引き落とし"],["mainbank","ideco","out","iDeCo 毎月積立"],
      ["mainbank","seca","link","連携"],["mainbank","exa","link","連携"],["mainbank","subbank","out","自動入金 毎月5日"],
      ["subbank","family","out","生活費 月末"],["subbank","secb","out","ハイブリッド預金"],["secb","subbank","in","配当・分配金"],["subbank","exb","link","連携"],
      ["subbank","debit","out","デビット"],["debit","paya","out","引き落とし"],["debit","payb","out","引き落とし"],["paya","vend","out","支払い"],["paya","drink","out","支払い"],
      ["subbank","stable","out","購入"],["stable","walleta","out","送金"],["walleta","crypto","out","スワップ → チャージ"],["walleta","walletb","out","送金"],
      ["walletb","appa","link","連携"],["walletb","appb","link","連携"],
      ["crypto","ic","out","チャージ"],["crypto","shop","out","支払い"],["crypto","food","out","支払い"],["crypto","conv","out","支払い"],
    ].map(([from,to,kind,label],i)=>({id:"e"+i,from,to,kind,label}));
    const D = [
      {id:"d1",source:"mainbank",day:1,item:"カード分割払い",sub:"1日固定",amt:25000,via:"",rollover:false,kind:"out"},
      {id:"d2",source:"mainbank",day:5,item:"サブ銀行へ自動入金",sub:"",amt:150000,via:"subbank",rollover:false,kind:"in"},
      {id:"d3",source:"mainbank",day:15,item:"生命保険",sub:"",amt:2500,via:"",rollover:true,kind:"out"},
      {id:"d4",source:"mainbank",day:26,item:"iDeCo",sub:"",amt:23000,via:"ideco",rollover:true,kind:"out"},
      {id:"d5",source:"mainbank",day:26,item:"クレジットカードA",sub:"",amt:null,via:"carda",parts:"積立NISA 50,000円, ジム 3,000円",rollover:true,kind:"out"},
      {id:"d6",source:"mainbank",day:27,item:"クレジットカードB",sub:"",amt:null,via:"cardb",parts:"電気, 水道",rollover:true,kind:"out"},
      {id:"d7",source:"mainbank",day:27,item:"家賃",sub:"",amt:100000,via:"",rollover:true,kind:"out"},
      {id:"d8",source:"subbank",day:31,item:"家族の口座へ生活費",sub:"最終営業日",amt:100000,via:"family",rollover:true,kind:"out"},
    ];
    return { version:1, nodes:N, edges:E, debits:D, settings:{ notify:true, partner:"家族", sample:true, updated:new Date().toISOString().slice(0,10) } };
  }

  // ===== 状態 =====
  let S;
  function load(){ try{ const raw=localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : sample(); }catch(e){ S = sample(); } if(!S.settings) S.settings={notify:true,partner:"家族",sample:false}; }
  function save(){ S.settings.updated = new Date().toISOString().slice(0,10); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("保存できませんでした（ブラウザの保存領域が使えません）"); } }
  const byId = id => S.nodes.find(n=>n.id===id);
  const uid = p => p + Math.random().toString(36).slice(2,8);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const yen = n => Number(n).toLocaleString("ja-JP") + "円";
  const outOf = id => S.edges.filter(e=>e.from===id), inTo = id => S.edges.filter(e=>e.to===id);
  const flowEdges = () => S.edges.filter(e=>e.kind!=="link");
  const degree = id => S.edges.filter(e=>e.from===id||e.to===id).length;
  const flowDegree = id => flowEdges().filter(e=>e.from===id||e.to===id).length;
  const avatar = n => `<span class="av ${n.sq?'sq':''}" style="background:${esc(n.col)}">${esc(n.av)}</span>`;

  // ===== 自動レイアウト（縦の流れ） =====
  function layout(){
    const hubs = S.nodes.filter(n=>n.hub && n.type==="bank");
    const hubList = hubs.length ? hubs : S.nodes.filter(n=>n.type==="bank").slice(0,1);
    const fe = flowEdges();
    // 各ノードの最寄りハブ（入出金の辺を無向にたどった距離）
    const dist = {}; hubList.forEach(h=>{ dist[h.id]={}; const q=[[h.id,0]]; const seen=new Set([h.id]); while(q.length){ const [x,d]=q.shift(); dist[h.id][x]=d; fe.forEach(e=>{ const y = e.from===x?e.to: e.to===x?e.from:null; if(y && !seen.has(y)){ seen.add(y); q.push([y,d+1]); } }); } });
    const owner = {}; S.nodes.forEach(n=>{ if(n.hub && n.type==="bank"){ owner[n.id]=n.id; return; } let best=null, bd=1e9; hubList.forEach(h=>{ const d=dist[h.id][n.id]; if(d!=null && d<bd){ bd=d; best=h.id; } }); owner[n.id]=best; });
    const sections = hubList.map(h=>{
      const placed=[]; const rows=[];
      // 収入（ハブへ in で入るもの、ただし他ハブ由来の振替は除く）
      inTo(h.id).filter(e=>e.kind==="in" && byId(e.from) && byId(e.from).type==="income").forEach(e=>{ rows.push({id:e.from,kind:"in",depth:0}); placed.push(e.from); });
      rows.push({id:h.id,kind:"in",depth:0,hub:true}); placed.push(h.id);
      // ハブから out で下る（深さ優先、同一ハブ配下のみ）
      const walk=(x,depth)=>{ outOf(x).filter(e=>e.kind==="out").forEach(e=>{ const y=byId(e.to); if(!y||placed.includes(e.to)||owner[e.to]!==h.id||y.hub) return; placed.push(e.to); rows.push({id:e.to,kind:"out",depth:Math.min(depth,3),label:e.label}); walk(e.to,depth+1); }); };
      walk(h.id,1);
      // 他ハブへの振替（out）はチップで示す
      const transfers = outOf(h.id).filter(e=>e.kind==="out" && byId(e.to) && byId(e.to).hub);
      // 連携（link）: この帯の配置済みノードに link で結ばれる未配置ノード
      const links=[]; S.edges.filter(e=>e.kind==="link").forEach(e=>{ const a=placed.includes(e.from), b=placed.includes(e.to); if(a && !b && owner[e.to]==null) links.push({id:e.to, with:e.from}); else if(b && !a && owner[e.from]==null) links.push({id:e.from, with:e.to}); });
      return {hub:h, rows, links, transfers, placed};
    });
    const placedAll = new Set(sections.flatMap(s=>[...s.placed, ...s.links.map(l=>l.id)]));
    const unplaced = S.nodes.filter(n=>!placedAll.has(n.id));
    return {sections, unplaced, owner};
  }

  // ===== マップ =====
  function tileHtml(n, opts){
    opts=opts||{}; const chips=[];
    const dc = S.debits.filter(d=>d.source===n.id).length; if(dc) chips.push(`<span class="chip">定期引落 ${dc}件</span>`);
    (n.chips||[]).forEach(c=>chips.push(`<span class="chip">${esc(c)}</span>`));
    (opts.chips||[]).forEach(c=>chips.push(`<span class="chip">${esc(c)}</span>`));
    if(n.ap) chips.push(`<span class="chip ap">Apple Pay</span>`);
    if(inTo(n.id).some(e=>e.kind==="in") && n.type!=="bank" && n.type!=="income") chips.push(`<span class="chip ok">入金あり</span>`);
    if(n.off) chips.push(`<span class="chip off">解約予定</span>`);
    const cls=["tile", n.hub?"hub":"", (degree(n.id)===0)?"dim":"", n.off?"off":"", n.zone?"zone":""].join(" ");
    const sub = degree(n.id)===0 ? "つながり未登録" : n.sub;
    return `<button class="${cls}" data-edit="${n.id}">${avatar(n)}<div class="t"><span class="n">${esc(n.name)}</span>${sub?`<span class="s">${esc(sub)}</span>`:""}</div><div class="chips">${chips.join("")}</div></button>`;
  }
  function renderMap(){
    const L = layout(); let h = "";
    if(!S.nodes.length){ h = `<div class="empty">まだ何もありません。右下の「＋」から銀行を追加してください。最初に追加した銀行が起点（ハブ）になります。</div>`; }
    L.sections.forEach((sec,i)=>{
      h += `<div class="sec"><span class="num">${String(i+1).padStart(2,"0")}</span><h3>${esc(sec.hub.name)}系統</h3></div><div class="flow">`;
      sec.rows.forEach((r,j)=>{ const n=byId(r.id); const pos = sec.rows.length===1?"only": j===0?"start": j===sec.rows.length-1?"end":""; const arrow = `<span></span>`;
        const chips = r.hub ? sec.transfers.map(t=>`→ ${byId(t.to).name}`) : [];
        h += `<div class="c ${pos} ${r.kind} ${n.off?'off':''}">${arrow}</div><div class="d${r.depth>1?Math.min(r.depth-1,3):0}">${tileHtml(n,{chips})}</div>`; });
      h += `</div>`;
      if(sec.links.length) h += `<div class="lbl">連携（線なし）</div><div class="row2">${sec.links.map(l=>{ const n=byId(l.id); return `<button class="mini ${n.off?'off':''}" data-edit="${n.id}">${avatar(n)}${esc(n.name)}<small>連携 ${esc(byId(l.with).name)}</small></button>`; }).join("")}</div>`;
    });
    if(L.unplaced.length) h += `<div class="lbl">つながり未登録</div><div class="row2">${L.unplaced.map(n=>`<button class="mini dim ${n.off?'off':''}" data-edit="${n.id}">${avatar(n)}${esc(n.name)}<small>${esc(TYPES[n.type]||"")}</small></button>`).join("")}</div>`;
    h += `<div class="hint">タイルをタップすると編集できます。配置は「入金・出金」のつながりから自動で決まります。</div>`;
    document.getElementById("v-map").innerHTML = h;
  }

  // ===== 整理 =====
  let pick = null;
  function checklist(id){
    const n=byId(id); const items=[];
    S.debits.filter(d=>d.via===id).forEach(d=>{ const parts=(d.parts||"").split(/[、,]/).map(s=>s.trim()).filter(Boolean); (parts.length?parts:[d.item]).forEach(p=>items.push({t:`引き落とし先を移す：${p}`, s:`${dayLabel(d.day)} ・ ${n.name}払い`})); });
    outOf(id).filter(e=>e.kind!=="link").forEach(e=>items.push({t:`${byId(e.to)?byId(e.to).name:"?"} の${e.label||"支払い"}を別の手段に移す`, s:"この先につながっているもの"}));
    S.edges.filter(e=>e.kind==="link"&&(e.from===id||e.to===id)).forEach(e=>items.push({t:`${byId(e.from===id?e.to:e.from)?.name} との連携を解除する`, s:"連携"}));
    if(n.ap) items.push({t:"Apple Payの登録を外す", s:"iPhone のウォレット"});
    inTo(id).filter(e=>e.kind!=="link").forEach(e=>items.push({t:`${byId(e.from)?.name} からの${e.label||"入金"}が止まる`, s:"自動で反映", done:true}));
    return items;
  }
  function renderClean(){
    const unlinked = S.nodes.filter(n=>n.type==="bank" && degree(n.id)===0);
    const groups = {}; S.nodes.filter(n=>!n.off && (n.type==="pay"||n.type==="card")).forEach(n=>{ const p = inTo(n.id).find(e=>e.kind==="out"); if(p){ const k=n.type+"@"+p.from; (groups[k]=groups[k]||[]).push(n); } });
    const dups = Object.values(groups).filter(g=>g.length>1);
    const byDay = {}; S.debits.filter(d=>!(d.via && byId(d.via)?.off)).forEach(d=>{ byDay[d.day]=(byDay[d.day]||0)+1; });
    const busy = Object.entries(byDay).filter(([d,c])=>c>=2).map(([d])=>dayLabel(+d)).join("・");
    const cand = S.nodes.filter(n=>!n.hub && n.type!=="income" && n.type!=="use");
    if(!pick || !byId(pick)) pick = cand[0]?.id || null;
    const items = pick ? checklist(pick) : [];
    document.getElementById("v-clean").innerHTML =
      `<div class="kpi"><div class="${unlinked.length?'w':''}"><b>${unlinked.length}</b><span>未接続の口座</span></div><div class="${dups.length?'w':''}"><b>${dups.length}</b><span>役割の重複</span></div><div><b>${busy||"—"}</b><span>引き落とし集中日</span></div></div>` +
      (unlinked.length ? `<div class="card"><h4><span class="sev"></span>つながりのない口座が${unlinked.length}つあります</h4><ul class="list">${unlinked.map(n=>`<li>${avatar(n)}${esc(n.name)}<span class="r">入出金・連携なし</span></li>`).join("")}</ul><p>図の中で線が1本もありません。使っていなければ解約候補です。</p></div>` : `<div class="empty">つながりのない口座はありません。</div>`) +
      (dups.length ? dups.map(g=>`<div class="card"><h4><span class="sev"></span>同じ役割の${TYPES[g[0].type]}が${g.length}つあります</h4><ul class="list">${g.map(n=>`<li>${avatar(n)}${esc(n.name)}<span class="r">${esc(byId(inTo(n.id).find(e=>e.kind==="out").from)?.name)}から ・ 利用先${outOf(n.id).length}</span></li>`).join("")}</ul><p>利用先が少ないものは、使い分けの理由がなければ1つに寄せられます。</p></div>`).join("") : `<div class="empty">同じ役割の重複はありません。</div>`) +
      `<div class="card"><h4><span class="sev ok"></span>やめるチェックリスト</h4>` +
      (cand.length ? `<select id="pick">${cand.map(n=>`<option value="${n.id}" ${n.id===pick?"selected":""}>${esc(n.name)}${n.off?"（解約予定）":""}</option>`).join("")}</select>` +
        (items.length ? `<div class="check">${items.map(it=>`<label><input type="checkbox" ${it.done?"checked":""}><span>${esc(it.t)}<small>${esc(it.s)}</small></span></label>`).join("")}</div>` : `<div class="empty">紐づくものはありません。そのまま解約できます。</div>`) +
        `<button class="btn ${byId(pick).off?'':'danger'} blk" id="toggleOff">${byId(pick).off?"解約予定を取り消す":"解約予定にする"}</button><button class="btn pri blk" id="goMap">解約後のマップを確認する</button>` : `<div class="empty">対象になる機関がまだありません。</div>`) + `</div>`;
    const sel=document.getElementById("pick"); if(sel) sel.addEventListener("change", e=>{ pick=e.target.value; renderClean(); });
    const t=document.getElementById("toggleOff"); if(t) t.addEventListener("click", ()=>{ const n=byId(pick); n.off=!n.off; save(); renderAll(); toast(n.off?`${n.name} を解約予定にしました`:`${n.name} の解約予定を取り消しました`); });
    const g=document.getElementById("goMap"); if(g) g.addEventListener("click", ()=>show("map"));
  }

  // ===== 引き落とし =====
  const dayLabel = d => d>=31 ? "月末" : `${d}日`;
  function renderDebit(){
    const live = S.debits.filter(d=>!(d.via && byId(d.via)?.off));
    const fixed = live.filter(d=>d.amt!=null).reduce((a,d)=>a+Number(d.amt),0), varn = live.filter(d=>d.amt==null).length;
    const days = Array.from({length:31},(_,i)=>i+1).map(d=>{ const hit=live.filter(x=>x.day===d); const cls=hit.length?(hit.every(x=>x.kind==="in")?"in":"on"):""; const lab=(hit.length||d===1||d%5===0||d===31)?(d===31?"末":d):""; return `<i data-d="${lab}" class="${cls}"></i>`; }).join("");
    const banks = S.nodes.filter(n=>n.type==="bank" && S.debits.some(d=>d.source===n.id));
    const need = banks.map(b=>{ const l=live.filter(d=>d.source===b.id); const f=l.filter(d=>d.amt!=null).reduce((a,d)=>a+Number(d.amt),0); const v=l.filter(d=>d.amt==null).length; const last=Math.max(...l.map(d=>d.day)); return `<div class="need">${avatar(b)}<div class="t"><span class="n">${esc(b.name)}</span><span class="s">${dayLabel(last)}までに必要</span></div><div class="amt">${yen(f)}${v?`<small>＋ 変動分 ${v}件</small>`:""}</div></div>`; }).join("");
    const rows = [...S.debits].sort((a,b)=>a.day-b.day).map(d=>`<button class="drow ${(d.via&&byId(d.via)?.off)?'off':''}" data-editd="${d.id}"><span class="d ${d.kind==='in'?'in':''}">${dayLabel(d.day)}</span><span class="n">${esc(d.item)}<small>${esc([byId(d.source)?.name, d.parts?("含む: "+d.parts):"", d.rollover?"休業日は翌営業日":"", d.sub].filter(Boolean).join(" ・ "))}</small></span><span class="a">${d.amt!=null?yen(d.amt):'変動<small>金額未設定</small>'}</span></button>`).join("");
    document.getElementById("v-debit").innerHTML =
      `<div class="month"><b>毎月の予定 ${S.debits.length}件</b><span>固定額 ${yen(fixed)}${varn?` ＋ 変動 ${varn}件`:""}</span></div><div class="days">${days}</div>` + need +
      (S.debits.length ? `<div class="dlist">${rows}</div>` : `<div class="empty">定期引き落としがまだありません。右下の「＋」から追加してください。</div>`) +
      `<div class="toggle ${S.settings.notify?'on':''}" id="notify"><span>前日に通知する<small>Web版では通知は動きません（アプリ版で実装）</small></span><span class="sw"></span></div>`;
    document.getElementById("notify").addEventListener("click", ()=>{ S.settings.notify=!S.settings.notify; save(); renderDebit(); });
  }

  // ===== 共有 =====
  function renderShare(){
    const hubs = S.nodes.filter(n=>n.hub); const secs = S.nodes.filter(n=>n.type==="securities"&&!n.off); const zones = S.nodes.filter(n=>n.zone&&!n.off);
    document.getElementById("v-share").innerHTML =
      `<div class="partner"><span class="av">${esc((S.settings.partner||"家")[0])}</span><div class="t"><span class="n">${esc(S.settings.partner||"家族")}（閲覧のみ）</span><span class="s">最終更新 ${esc(S.settings.updated||"")}</span></div><button class="btn sm" id="editPartner">名前</button></div>` +
      `<div class="card"><h4><span class="sev ok"></span>相手に渡るもの</h4><ul class="yes"><li>お金の流れマップ（構造図）</li><li>口座・カード・アプリの一覧と役割</li><li>定期引き落としの一覧</li><li>もしもの時に見る順番</li></ul></div>` +
      `<div class="card"><h4><span class="sev bad"></span>このアプリに保存しないもの</h4><ul class="no"><li>残高・取引明細</li><li>暗証番号・パスワード・秘密鍵</li><li>口座番号・カード番号</li></ul><p>「どこに何があるか」だけを渡します。データはこの端末の中にだけ保存されます。</p></div>` +
      `<div class="card"><h4>もしもの時に見る順番</h4><ol class="list" style="counter-reset:s">${[...hubs.map(h=>`${h.name} ── ${h.sub||"銀行口座"}`), secs.length?`証券・取引所 ── ${secs.map(s=>s.name).join("・")}`:"", zones.length?`オンチェーン ── ${zones.map(z=>z.name).join("・")}（所在のみ。復旧手順は別紙）`:""].filter(Boolean).map((t,i)=>`<li><span class="d" style="background:var(--ink);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:10px;font-weight:700">${i+1}</span>${esc(t)}</li>`).join("")}</ol></div>` +
      `<button class="btn pri blk" id="print">印刷 / PDFに保存（マップと引き落とし）</button>` +
      `<div class="card"><h4>データの書き出し・読み込み</h4><p>書き出したテキストを控えておけば、別の端末やアプリ版へ移せます。</p><div class="actions"><button class="btn" id="exportBtn">書き出す</button><button class="btn" id="importBtn">読み込む</button></div><textarea id="io" rows="4" placeholder="ここに書き出し結果が出ます／読み込むテキストを貼り付けます"></textarea></div>` +
      `<div class="card"><h4>データの初期化</h4><div class="actions"><button class="btn" id="loadSample">サンプルを読み込む</button><button class="btn danger" id="clearAll">すべて消して空にする</button></div></div>` +
      `<div class="foot">Web版（GitHub Pages）。閲覧リンク共有はアプリ版で実装予定。</div>`;
    document.getElementById("print").addEventListener("click", ()=>{ show("map"); setTimeout(()=>window.print(), 100); });
    document.getElementById("exportBtn").addEventListener("click", ()=>{ const ta=document.getElementById("io"); ta.value=JSON.stringify(S); ta.select(); try{ document.execCommand("copy"); toast("書き出してコピーしました"); }catch(e){ toast("書き出しました。テキストを選択してコピーしてください"); } });
    document.getElementById("importBtn").addEventListener("click", ()=>{ const ta=document.getElementById("io"); try{ const o=JSON.parse(ta.value); if(!o.nodes||!o.edges) throw 0; if(!confirm("いまのデータを置き換えます。よろしいですか？")) return; S=o; save(); renderAll(); toast("読み込みました"); }catch(e){ toast("読み込めません。書き出したテキストを貼り付けてください"); } });
    document.getElementById("loadSample").addEventListener("click", ()=>{ if(!confirm("いまのデータを消してサンプルに置き換えます。よろしいですか？")) return; S=sample(); save(); renderAll(); toast("サンプルを読み込みました"); });
    document.getElementById("clearAll").addEventListener("click", ()=>{ if(!confirm("すべてのデータを消します。よろしいですか？")) return; S={version:1,nodes:[],edges:[],debits:[],settings:{notify:true,partner:"家族",sample:false}}; save(); renderAll(); toast("空にしました"); });
    document.getElementById("editPartner").addEventListener("click", ()=>{ const v=prompt("共有相手の呼び名", S.settings.partner||"家族"); if(v!=null){ S.settings.partner=v.trim()||"家族"; save(); renderShare(); } });
  }

  // ===== 編集シート =====
  const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim");
  function openSheet(html){ sheet.innerHTML=html; sheet.classList.add("on"); scrim.classList.add("on"); }
  function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); sheet.innerHTML=""; }
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && sheet.classList.contains("on")) closeSheet(); });
  const opt = (list, sel) => list.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join("");

  function nodeForm(n, isNew){
    const others = S.nodes.filter(x=>x.id!==n.id).map(x=>[x.id,x.name]);
    const edges = S.edges.filter(e=>e.from===n.id||e.to===n.id);
    openSheet(`<h2>${isNew?"機関を追加":"機関を編集"}<button id="close" aria-label="閉じる">×</button></h2>
      <div class="f"><label>種類</label><select id="ntype">${opt(Object.entries(TYPES), n.type)}</select></div>
      <div class="f"><label>名前</label><input type="text" id="nname" value="${esc(n.name)}" placeholder="例: メイン銀行"></div>
      <div class="f"><label>補足（任意）</label><input type="text" id="nsub" value="${esc(n.sub||"")}" placeholder="例: 給与振込口座 ・ 26日引き落とし"></div>
      <div class="f3"><div class="f"><label>チップ（読点区切り・任意）</label><input type="text" id="nchips" value="${esc((n.chips||[]).join("、"))}" placeholder="例: ETC"></div><div class="f"><label>頭文字</label><input type="text" id="nav" value="${esc(n.av)}" maxlength="2"></div><div class="f"><label>色</label><input type="color" id="ncol" value="${esc(n.col)}"></div></div>
      <div class="f2"><label class="cb"><input type="checkbox" id="nhub" ${n.hub?"checked":""}>起点の銀行（ハブ）</label><label class="cb"><input type="checkbox" id="nap" ${n.ap?"checked":""}>Apple Pay 登録</label><label class="cb"><input type="checkbox" id="nzone" ${n.zone?"checked":""}>オンチェーン領域</label><label class="cb"><input type="checkbox" id="nsq" ${n.sq?"checked":""}>角丸四角のアイコン</label></div>
      ${isNew?"":`<div class="f"><label>つながり</label><div class="edges">${edges.length?edges.map(e=>`<div class="e"><span>${e.from===n.id?`<b>この機関</b> → ${esc(byId(e.to)?.name)}`:`${esc(byId(e.from)?.name)} → <b>この機関</b>`}　<small>${esc(KINDS[e.kind].split("（")[0])}${e.label?" ・ "+esc(e.label):""}</small></span><button class="btn sm" data-deledge="${e.id}">削除</button></div>`).join(""):`<div class="hint">まだつながりがありません。</div>`}</div></div>
      <div class="f"><label>つながりを追加</label><div class="f3"><select id="edir"><option value="out">この機関 → 相手</option><option value="in">相手 → この機関</option></select><select id="ekind">${opt(Object.entries(KINDS),"out")}</select><select id="etarget">${opt(others, others[0]?.[0])}</select></div><div class="inline"><input type="text" id="elabel" placeholder="線のラベル（任意）例: 引き落とし"><button class="btn sm" id="addEdge">追加</button></div></div>`}
      <div class="actions"><button class="btn pri" id="saveNode">保存</button>${isNew?"":`<button class="btn" id="offNode">${n.off?"解約予定を取消":"解約予定"}</button><button class="btn danger" id="delNode">削除</button>`}</div>`);
    document.getElementById("close").addEventListener("click", closeSheet);
    document.getElementById("ntype").addEventListener("change", e=>{ if(isNew){ const [av,col,sq]=TYPE_DEFAULT[e.target.value]; document.getElementById("nav").value=av; document.getElementById("ncol").value=col; document.getElementById("nsq").checked=sq; } });
    const read = ()=>{ n.type=document.getElementById("ntype").value; n.name=document.getElementById("nname").value.trim()||"名称未設定"; n.sub=document.getElementById("nsub").value.trim(); n.chips=document.getElementById("nchips").value.split(/[、,]/).map(s=>s.trim()).filter(Boolean); n.av=document.getElementById("nav").value.trim()||n.name[0]; n.col=document.getElementById("ncol").value; n.hub=document.getElementById("nhub").checked && n.type==="bank"; n.ap=document.getElementById("nap").checked; n.zone=document.getElementById("nzone").checked; n.sq=document.getElementById("nsq").checked; };
    document.getElementById("saveNode").addEventListener("click", ()=>{ read(); if(isNew) S.nodes.push(n); save(); closeSheet(); renderAll(); toast("保存しました"); });
    if(!isNew){
      sheet.querySelectorAll("[data-deledge]").forEach(b=>b.addEventListener("click", ()=>{ S.edges=S.edges.filter(e=>e.id!==b.dataset.deledge); save(); nodeForm(n,false); renderAll(); }));
      document.getElementById("addEdge").addEventListener("click", ()=>{ const dir=document.getElementById("edir").value, kind=document.getElementById("ekind").value, tgt=document.getElementById("etarget").value, label=document.getElementById("elabel").value.trim(); if(!tgt) return; read(); S.edges.push({id:uid("e"), from:dir==="out"?n.id:tgt, to:dir==="out"?tgt:n.id, kind, label}); save(); nodeForm(n,false); renderAll(); toast("つながりを追加しました"); });
      document.getElementById("offNode").addEventListener("click", ()=>{ read(); n.off=!n.off; save(); closeSheet(); renderAll(); });
      document.getElementById("delNode").addEventListener("click", ()=>{ if(!confirm(`${n.name} を削除します。つながりも消えます。よろしいですか？`)) return; S.nodes=S.nodes.filter(x=>x.id!==n.id); S.edges=S.edges.filter(e=>e.from!==n.id&&e.to!==n.id); S.debits.forEach(d=>{ if(d.via===n.id) d.via=""; }); S.debits=S.debits.filter(d=>d.source!==n.id); save(); closeSheet(); renderAll(); toast("削除しました"); });
    }
  }
  function debitForm(d, isNew){
    const banks = S.nodes.filter(n=>n.type==="bank").map(n=>[n.id,n.name]);
    const vias = [["","（なし）"], ...S.nodes.filter(n=>n.type!=="income").map(n=>[n.id,n.name])];
    if(!banks.length){ toast("先に銀行口座を追加してください"); return; }
    openSheet(`<h2>${isNew?"定期引き落としを追加":"定期引き落としを編集"}<button id="close" aria-label="閉じる">×</button></h2>
      <div class="f"><label>引き落とし元の銀行</label><select id="dsrc">${opt(banks, d.source||banks[0][0])}</select></div>
      <div class="f2"><div class="f"><label>引き落とし日（31＝月末）</label><input type="number" id="dday" min="1" max="31" value="${d.day||27}"></div><div class="f"><label>金額（空欄＝変動）</label><input type="number" id="damt" value="${d.amt==null?"":d.amt}" placeholder="例: 100000"></div></div>
      <div class="f"><label>項目</label><input type="text" id="ditem" value="${esc(d.item||"")}" placeholder="例: 家賃 ／ クレジットカードA"></div>
      <div class="f"><label>内訳（読点区切り・任意）</label><input type="text" id="dparts" value="${esc(d.parts||"")}" placeholder="例: 電気, 水道"></div>
      <div class="f"><label>経由する機関（任意。カード払いならそのカード）</label><select id="dvia">${opt(vias, d.via||"")}</select></div>
      <div class="f"><label>補足（任意）</label><input type="text" id="dsub" value="${esc(d.sub||"")}"></div>
      <div class="f2"><label class="cb"><input type="checkbox" id="droll" ${d.rollover?"checked":""}>銀行休業日は翌営業日</label><label class="cb"><input type="checkbox" id="dkind" ${d.kind==="in"?"checked":""}>自分の口座間の振替（緑）</label></div>
      <div class="actions"><button class="btn pri" id="saveD">保存</button>${isNew?"":`<button class="btn danger" id="delD">削除</button>`}</div>`);
    document.getElementById("close").addEventListener("click", closeSheet);
    document.getElementById("saveD").addEventListener("click", ()=>{ d.source=document.getElementById("dsrc").value; d.day=Math.min(31,Math.max(1,parseInt(document.getElementById("dday").value)||1)); const a=document.getElementById("damt").value.trim(); d.amt=a===""?null:Number(a); d.item=document.getElementById("ditem").value.trim()||"名称未設定"; d.parts=document.getElementById("dparts").value.trim(); d.via=document.getElementById("dvia").value; d.sub=document.getElementById("dsub").value.trim(); d.rollover=document.getElementById("droll").checked; d.kind=document.getElementById("dkind").checked?"in":"out"; if(isNew) S.debits.push(d); save(); closeSheet(); renderAll(); toast("保存しました"); });
    if(!isNew) document.getElementById("delD").addEventListener("click", ()=>{ if(!confirm("この引き落としを削除します。よろしいですか？")) return; S.debits=S.debits.filter(x=>x.id!==d.id); save(); closeSheet(); renderAll(); });
  }

  // ===== 画面切り替え・共通 =====
  let view="map";
  const META = { map:["マップ", ()=>`${S.nodes.length}機関 ・ ${S.settings.updated||""}`], clean:["整理", ()=>"見直し候補"], debit:["引き落とし", ()=>"毎月の予定"], share:["共有", ()=>"もしもの時のために"] };
  function show(v){ view=v; ["map","clean","debit","share"].forEach(k=>{ document.getElementById("v-"+k).hidden=(k!==v); }); document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); document.getElementById("ttl").textContent=META[v][0]; document.getElementById("sub").textContent=META[v][1](); document.getElementById("fab").hidden = !(v==="map"||v==="debit"); window.scrollTo(0,0); }
  let tt; function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),1800); }
  function renderBanner(){ document.getElementById("banner").innerHTML = S.settings.sample ? `<div class="banner">表示中は架空のサンプルです。編集すると自分のデータになります。<button class="btn sm" id="startEmpty">空にする</button></div>` : ""; const b=document.getElementById("startEmpty"); if(b) b.addEventListener("click", ()=>{ if(!confirm("サンプルを消して空から始めます。よろしいですか？")) return; S={version:1,nodes:[],edges:[],debits:[],settings:{notify:true,partner:"家族",sample:false}}; save(); renderAll(); }); }
  function renderAll(){ renderBanner(); renderMap(); renderClean(); renderDebit(); renderShare(); document.getElementById("sub").textContent=META[view][1](); }
  document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) show(b.dataset.v); });
  document.getElementById("fab").addEventListener("click", ()=>{ if(view==="debit") debitForm({id:uid("d"),day:27,amt:null,rollover:true,kind:"out"}, true); else { const [av,col,sq]=TYPE_DEFAULT.bank; nodeForm({id:uid("n"),name:"",sub:"",type:"bank",av,col,sq,hub:!S.nodes.some(n=>n.hub),ap:false,zone:false,chips:[],off:false}, true); } });
  document.body.addEventListener("click", e=>{ const t=e.target.closest("[data-edit]"); if(t){ const n=byId(t.dataset.edit); if(n){ if(S.settings.sample){ S.settings.sample=false; } nodeForm(n,false); } return; } const d=e.target.closest("[data-editd]"); if(d){ const x=S.debits.find(y=>y.id===d.dataset.editd); if(x){ S.settings.sample=false; debitForm(x,false); } } });
  const origSave = save;
  load(); renderAll(); show("map");
})();
</script>
</body>
</html>
